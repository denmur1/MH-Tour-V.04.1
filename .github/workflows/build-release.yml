name: MH Tour - Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mh-tour-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MH Tour Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android SDK without setup-android action
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK tidak ditemukan: $SDK_ROOT"; exit 1; }

          # Jangan memakai android-actions/setup-android@v3 karena action tersebut
          # memanggil `sdkmanager tools`, sedangkan package legacy `tools` sudah
          # tidak tersedia pada repository SDK saat ini.
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager tidak ditemukan."; exit 1;
          }

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          echo "Android SDK licenses processed."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          files=(
            android/settings.gradle.kts
            android/build.gradle.kts
            android/gradle.properties
            android/app/build.gradle.kts
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/java/com/mhtour/audio/MainActivity.kt
            android/app/src/main/res/drawable/donation_qr.png
            android/app/src/main/res/xml/file_paths.xml
            server/server.js
            server/livekit.yaml
            server/package.json
          )
          for f in "${files[@]}"; do
            test -s "$f" || { echo "ERROR: file wajib tidak ditemukan/kosong: $f"; exit 1; }
          done
          echo "Project structure OK."

      - name: Validate protected LiveKit configuration
        shell: bash
        run: |
          set -euo pipefail
          APP=android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          GRADLE=android/app/build.gradle.kts

          grep -Fq 'io.livekit:livekit-android:2.28.2' "$GRADLE"
          grep -Fq 'TokenSource.fromDevelopmentTokenServer("mhtour-19kg8e")' "$APP"
          grep -Fq 'LiveKit.init(applicationContext)' "$APP"
          grep -Fq 'LiveKit.create(applicationContext)' "$APP"
          grep -Fq 'newRoom.connect(' "$APP"
          grep -Fq 'autoSubscribe = true' "$APP"
          grep -Fq 'setMicrophoneEnabled(true)' "$APP"

          echo "LiveKit client configuration OK."
          echo "Server LiveKit tidak diubah dan tidak dideploy oleh workflow ini."

      - name: Validate all main buttons and actions
        shell: bash
        run: |
          set -euo pipefail
          APP=android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          required=(
            'Dengarkan Sebagai Jemaah'
            'Lanjut Sebagai Pemandu'
            'Donasi Seikhlasnya'
            'Buat Sesi Rombongan'
            'Bagikan Kode & QR Rombongan'
            'Mulai Bicara'
            'Mute Mikrofon'
            'Scan QR Rombongan'
            'Gabung & Dengarkan'
            'Kembali ke Beranda'
            'donationScreen()'
            'openDonationLink()'
            'downloadDonationQr()'
            'shareQrImage(c)'
          )

          for text in "${required[@]}"; do
            grep -Fq "$text" "$APP" || { echo "ERROR: aksi/tombol tidak ditemukan: $text"; exit 1; }
          done
          echo "Main buttons/actions OK."

      - name: Validate donation feature
        shell: bash
        run: |
          set -euo pipefail
          APP=android/app/src/main/java/com/mhtour/audio/MainActivity.kt
          URL='https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012012023022707162488'

          grep -Fq "$URL" "$APP"
          grep -Fq 'R.drawable.donation_qr' "$APP"
          grep -Fq 'Pictures/MH Tour' "$APP"

          if grep -Fq 'saweria.co' "$APP"; then
            echo "ERROR: link donasi lama masih ada."
            exit 1
          fi
          echo "Donation feature OK."

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          grep -Fq 'compileSdk = 35' "$GRADLE"
          grep -Fq 'minSdk = 26' "$GRADLE"
          grep -Fq 'targetSdk = 35' "$GRADLE"
          grep -Fq 'sourceCompatibility = JavaVersion.VERSION_17' "$GRADLE"
          grep -Fq 'targetCompatibility = JavaVersion.VERSION_17' "$GRADLE"
          grep -Fq 'jvmTarget = "17"' "$GRADLE"
          echo "Gradle configuration OK."

      - name: Prepare release signing key
        shell: bash
        env:
          MH_KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${MH_KEYSTORE_BASE64:-}" ] && \
             [ -n "${MH_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${MH_KEY_ALIAS:-}" ] && \
             [ -n "${MH_KEY_PASSWORD:-}" ]; then
            printf '%s' "$MH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mh-tour-release.jks"
            {
              echo "MH_KEYSTORE_FILE=$RUNNER_TEMP/mh-tour-release.jks"
              echo "MH_KEYSTORE_PASSWORD=$MH_KEYSTORE_PASSWORD"
              echo "MH_KEY_ALIAS=$MH_KEY_ALIAS"
              echo "MH_KEY_PASSWORD=$MH_KEY_PASSWORD"
              echo "MH_SIGNING_MODE=permanent"
            } >> "$GITHUB_ENV"
            echo "Using permanent signing key from GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/mh-tour-ci.jks" \
              -storetype JKS \
              -alias mh-tour-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass changeit \
              -keypass changeit \
              -dname "CN=MH Tour, OU=Mobile, O=MH Tour, L=Indonesia, ST=West Java, C=ID"
            {
              echo "MH_KEYSTORE_FILE=$RUNNER_TEMP/mh-tour-ci.jks"
              echo "MH_KEYSTORE_PASSWORD=changeit"
              echo "MH_KEY_ALIAS=mh-tour-ci"
              echo "MH_KEY_PASSWORD=changeit"
              echo "MH_SIGNING_MODE=temporary"
            } >> "$GITHUB_ENV"
            echo "No permanent signing secrets found; using temporary CI key for this build."
          fi

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            -PMH_KEYSTORE_FILE="$MH_KEYSTORE_FILE" \
            -PMH_KEYSTORE_PASSWORD="$MH_KEYSTORE_PASSWORD" \
            -PMH_KEY_ALIAS="$MH_KEY_ALIAS" \
            -PMH_KEY_PASSWORD="$MH_KEY_PASSWORD" \
            clean assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "ERROR: release APK tidak ditemukan."; exit 1; }
          echo "=== MH TOUR RELEASE APK BERHASIL ==="
          ls -lh "$APK"
          echo "Signing mode: $MH_SIGNING_MODE"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-V5.4-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
